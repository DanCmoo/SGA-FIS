# Application Configuration
spring.application.name=sistema-gestion-academica

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:academico_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (para debug - accesible en /api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL Initialization
spring.sql.init.mode=never

# JWT Configuration
jwt.secret=SuperSecretKeyForJWTTokenGenerationInSistemaGestionAcademica2025
jwt.expiration=86400000

# Logging Configuration
logging.level.com.academico=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
